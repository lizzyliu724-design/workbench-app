<title>工作台</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#F4F8FD;--card:#fff;--line:#DCEAF8;--line2:#EDF4FB;
  --brand:#378ADD;--brand-d:#1E6FBF;--brand-l:#E6F1FB;
  --text:#12395A;--muted:#6E8FAB;--hint:#9BB4C9;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
html{-webkit-text-size-adjust:100%}
body{font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#E8F0F8;color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.hidden{display:none!important}
.stwarn{background:#FDECEC;color:#9B2C2C;border-bottom:1px solid #F3C9C9;padding:8px 12px;font-size:12px;line-height:1.55;text-align:center}
.app{width:100%;max-width:480px;min-height:100vh;min-height:100dvh;margin:0 auto;background:var(--bg);position:relative;overflow-x:hidden}
@media(min-width:600px){.app{box-shadow:0 12px 44px rgba(18,57,90,.10)}}

/* app bar */
.appbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:4px;padding:calc(var(--sat) + 6px) 8px 8px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line)}
.hbtn{all:unset;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#3A6484;cursor:pointer;flex:0 0 40px}
.hbtn:active{background:var(--brand-l)}
.hbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.atitle{flex:1;min-width:0;padding-left:2px}
.atitle b{display:block;font-size:16px;font-weight:500;letter-spacing:.3px}
.atitle small{display:block;font-size:11px;color:var(--hint);margin-top:1px}
main{padding:12px 12px calc(30px + var(--sab))}

/* drawer */
.drawer{position:fixed;top:0;bottom:0;left:0;width:80%;max-width:300px;background:#EAF3FC;z-index:80;transform:translateX(-102%);transition:transform .26s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;padding:calc(var(--sat) + 16px) 12px calc(var(--sab) + 12px);border-right:1px solid var(--line);overflow-y:auto}
.drawer.open{transform:none}
.scrim{position:fixed;inset:0;background:rgba(18,57,90,.36);opacity:0;pointer-events:none;transition:opacity .26s;z-index:70}
.scrim.on{opacity:1;pointer-events:auto}
.dhead{display:flex;align-items:center;gap:10px;padding:2px 8px 16px}
.logo{width:38px;height:38px;border-radius:12px;background:var(--brand);display:grid;place-items:center;flex:0 0 38px}
.logo svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.dhead b{font-size:14.5px;font-weight:500;display:block}
.dhead small{font-size:11px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px;flex:1}
.nav button{all:unset;display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:12px;font-size:14px;color:#3A6484;cursor:pointer;position:relative;transition:background .15s}
.nav button:active{background:#DCEBF9}
.nav button.on{background:#fff;color:var(--brand-d);font-weight:500;box-shadow:0 1px 2px rgba(30,111,191,.08)}
.nav svg{width:19px;height:19px;flex:0 0 19px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.nav .badge{margin-left:auto;font-size:10.5px;background:var(--brand);color:#fff;border-radius:20px;padding:1px 7px;font-weight:500}
.dfoot{border-top:1px solid #D5E6F7;padding-top:8px;margin-top:10px;display:flex;flex-direction:column;gap:1px}
.dfoot button{all:unset;font-size:12.5px;color:#6A8CA8;padding:9px 12px;border-radius:9px;cursor:pointer}
.dfoot button:active{background:#DCEBF9}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:11px}
.card h2{font-size:13px;font-weight:500;color:var(--brand-d);display:flex;align-items:center;gap:6px}
.card h2 svg{width:15px;height:15px;stroke:var(--brand);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.hstat{font-size:11.5px;color:var(--hint);white-space:nowrap}
.hstat b{color:var(--brand-d);font-weight:500;font-size:13px}

/* hero */
.hero{background:var(--brand-l);border:1px solid #CFE3F7;border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:14px;margin-bottom:12px}
.hero .ht{flex:1;min-width:0}
.hero .hd{font-size:11.5px;color:#3E7BB0;margin-bottom:2px}
.hero .hm{font-size:16px;font-weight:500;color:#0C447C;line-height:1.35}
.hero .hs{font-size:11.5px;color:#4B7796;margin-top:3px}
.ringwrap{position:relative;width:58px;height:58px;flex:0 0 58px}
.ringwrap span{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:500;color:var(--brand-d)}

/* date strip */
.datestrip{display:flex;align-items:center;gap:6px;margin-bottom:12px}
.datestrip .ds{font-size:13.5px;color:#3A6484;font-weight:500}
.ico{all:unset;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:#fff;border:1px solid var(--line);color:#4B7796;cursor:pointer;font-size:15px;flex:0 0 34px}
.ico:active{background:var(--brand-l)}
.spacer{flex:1}

/* form controls */
input,textarea,select{font-family:inherit;font-size:16px;color:var(--text);background:#F7FBFF;border:1px solid var(--line);border-radius:11px;padding:11px 12px;outline:none;width:100%;transition:border-color .15s;min-height:44px}
textarea{font-size:15px;resize:vertical;line-height:1.6}
input:focus,textarea:focus,select:focus{border-color:#8FBFE8;background:#fff}
select{cursor:pointer;appearance:none;background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath d='M1 1l4 4 4-4' fill='none' stroke='%236E8FAB' stroke-width='1.4' stroke-linecap='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 12px center;padding-right:30px}
.btn{all:unset;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px;min-height:44px;padding:0 18px;border-radius:12px;background:var(--brand);color:#fff;cursor:pointer;font-weight:500;transition:background .15s;white-space:nowrap;text-align:center;box-sizing:border-box;max-width:100%}
.hbtn,.ico,.icon-btn,.chk,.nav button,.dfoot button{box-sizing:border-box}
.btn:active{background:var(--brand-d)}
.btn.ghost{background:#fff;color:var(--brand-d);border:1px solid var(--line)}
.btn.ghost:active{background:var(--brand-l)}
.btn.sm{min-height:34px;padding:0 13px;font-size:12.5px;border-radius:10px}
.btn.wide{width:100%}
.icon-btn{all:unset;width:36px;height:36px;display:grid;place-items:center;border-radius:10px;color:#A6BECD;font-size:15px;line-height:1;flex:0 0 36px;cursor:pointer}
.icon-btn:active{background:#EDF5FD;color:var(--brand-d)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.addrow{display:flex;gap:8px;margin-bottom:10px}
.addrow input{flex:1;min-width:0}
.chip{font-size:13px;padding:8px 13px;border-radius:99px;border:1px solid var(--line);background:#fff;color:#4B7796;cursor:pointer;user-select:none;transition:.15s;white-space:nowrap;line-height:1.2;display:inline-block}
.chip:active{transform:scale(.97)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.tag{font-size:10.5px;padding:1px 7px;border-radius:5px;background:#EAF3FD;color:#3E7BB0;line-height:1.7;white-space:nowrap}
.tag.hi{background:#FFF2E2;color:#B4762A}
.tag.pin{background:#E7F1FC;color:#1E6FBF}
.hint{font-size:12.5px;color:var(--hint);line-height:1.7}
.empty{text-align:center;padding:24px 10px;color:var(--hint);font-size:12.5px}
.empty b{display:block;font-size:13px;color:#7E9FBA;font-weight:400;margin-bottom:4px}
.progress{height:7px;background:#EAF2FA;border-radius:99px;overflow:hidden;margin:0 0 12px}
.progress i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .25s}

/* todo */
.todo{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px dashed var(--line2)}
.todo:last-child{border-bottom:none}
.chk{all:unset;width:22px;height:22px;border-radius:7px;border:1.6px solid #9CC4E8;cursor:pointer;flex:0 0 22px;display:grid;place-items:center;color:#fff;font-size:12px;line-height:1;transition:.15s}
.chk.on{background:var(--brand);border-color:var(--brand)}
.todo .txt{flex:1;font-size:14.5px;word-break:break-word;line-height:1.5;min-width:0}
.todo.done .txt{color:#AFC6D6;text-decoration:line-through}

/* stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}
.stat{background:#F6FAFF;border:1px solid var(--line);border-radius:13px;padding:11px 13px}
.stat b{display:block;font-size:20px;font-weight:500;color:var(--brand-d);line-height:1.3}
.stat span{font-size:11.5px;color:var(--muted)}

/* bars */
.bars{display:flex;align-items:flex-end;gap:6px;height:78px}
.barcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end;min-width:0}
.barcol .bararea{width:100%;height:58px;display:flex;align-items:flex-end;background:#F1F7FD;border-radius:6px;overflow:hidden}
.barcol .bararea i{display:block;width:100%;background:var(--brand);border-radius:5px;min-height:2px}
.barcol .bararea i.zero{background:#DCE9F6}
.barcol span{font-size:10px;color:var(--hint)}

/* heatmap */
.heat{display:flex;gap:3.5px;overflow-x:auto;padding:2px 0 4px}
.hcol{display:flex;flex-direction:column;gap:3.5px}
.hcell{width:14px;height:14px;border-radius:3.5px;background:#EDF4FB;flex:0 0 14px}
.hcell.lv1{background:#CFE4F8}
.hcell.lv2{background:#8FBFE8}
.hcell.lv3{background:#378ADD}
.heat-legend{display:flex;align-items:center;gap:4px;font-size:10.5px;color:var(--hint);margin-top:9px}

/* list items */
.item{border:1px solid var(--line);border-radius:13px;padding:12px;margin-bottom:9px;background:#fff}
.item-top{display:flex;align-items:center;gap:7px;margin-bottom:6px;flex-wrap:wrap}
.item-top .who{font-size:11px;color:var(--hint)}
.item-body{font-size:14px;line-height:1.65;word-break:break-word;white-space:pre-wrap}
.item-acts{margin-left:auto;display:flex;gap:0;align-items:center}
.note-card{background:#FBFDFF;border:1px solid var(--line);border-radius:13px;padding:11px 12px;margin-bottom:8px}
.note-card.pinned{background:#F4FAFF;border-color:#C7DFF5}
.note-card .item-body{font-size:13.5px}
.listrow{display:flex;align-items:center;gap:9px;padding:11px 2px;border-bottom:1px dashed var(--line2);font-size:13px}
.listrow:last-child{border-bottom:none}
.listrow .amt{font-weight:500;font-size:13.5px;margin-left:auto;white-space:nowrap}
.amt.out{color:#D9534F}
.amt.in{color:#2E9E6B}
.listrow .dt{font-size:11px;color:var(--hint);width:42px;flex:0 0 42px}
.listrow .cat{font-size:10.5px;background:#F0F6FD;color:#5C87A8;padding:1px 7px;border-radius:5px;white-space:nowrap}
.listrow .nt{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.catbar{margin-bottom:10px}
.catbar .cl{display:flex;justify-content:space-between;font-size:12px;color:#4B7796;margin-bottom:5px}
.catbar .ct{height:8px;background:#EFF6FD;border-radius:99px;overflow:hidden}
.catbar .ct i{display:block;height:100%;background:var(--brand);border-radius:99px}
.done-line{display:flex;align-items:center;gap:8px;font-size:13.5px;color:#2E9E6B;background:#F1FAF5;border:1px solid #D6F0E2;border-radius:12px;padding:12px;margin-bottom:10px}

/* modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(18,57,90,.36);display:flex;align-items:flex-end;justify-content:center;z-index:100;padding:0}
.modal{background:#fff;border-radius:20px 20px 0 0;padding:20px 18px calc(18px + var(--sab));width:100%;max-width:480px;max-height:86vh;overflow:auto}
.modal h3{font-size:16px;font-weight:500;margin-bottom:5px}
.modal .mhint{font-size:12.5px;color:var(--muted);margin-bottom:14px}
.carry-row{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;font-size:14px;cursor:pointer}
.carry-row input{width:20px;height:20px;min-height:0;flex:0 0 20px;accent-color:var(--brand)}
.modal-acts{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.toast{position:fixed;left:50%;bottom:calc(30px + var(--sab));transform:translateX(-50%) translateY(14px);background:#1E6FBF;color:#fff;font-size:13px;padding:10px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:.22s;z-index:200;box-shadow:0 6px 18px rgba(18,57,90,.2)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>

<script>
/* ==================== 工具 ==================== */
var KEY='lizzy_workbench_v1';
var WD=['周日','周一','周二','周三','周四','周五','周六'];
function pad(n){return String(n).padStart(2,'0')}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parseISO(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function todayStr(){return iso(new Date())}
function addDays(s,n){var d=parseISO(s);d.setDate(d.getDate()+n);return iso(d)}
function fmtDate(s){var d=parseISO(s);return (d.getMonth()+1)+'月'+d.getDate()+'日 '+WD[d.getDay()]}
function mondayOf(s){var d=parseISO(s);var w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return iso(d)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function money(n){return '¥'+Number(n||0).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',')}
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function num(v){var n=parseFloat(v);return isNaN(n)?0:n}

/* ==================== 数据 ==================== */
function blank(){ return {todos:{},notes:[],workouts:{},finance:[],knowledge:[],memos:[],reviews:{},meta:{lastOpen:null}}; }
function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(!raw) return blank();
    var o=JSON.parse(raw)||{}, b=blank();
    for(var k in b){ if(o[k]===undefined) o[k]=b[k]; }
    o.meta=o.meta||{lastOpen:null};
    return o;
  }catch(e){ return blank(); }
}
var S=load();

function toast(m){

}
function svgIcon(n){ return '<svg viewBox="0 0 16 16">'+ICONS[n]+'</svg>'; }
function emptyBox(t,s){ return '<div class="empty"><b>'+t+'</b>'+(s||'')+'</div>'; }

/* ==================== 导航 ==================== */
function badgeFor(v){
  if(v==='plan'){ var t=(S.todos[todayStr()]||[]).filter(function(x){return !x.done}).length; return t?t:''; }
  if(v==='memo'){ var m=(S.memos||[]).filter(function(x){return !x.archived}).length; return m?m:''; }
  return '';
}
function buildNav(){
  var nav=$('#nav');
  nav.innerHTML=NAV.map(function(n){
    var b=badgeFor(n.v);
    return '<button data-v="'+n.v+'" onclick="go(\''+n.v+'\')">'+svgIcon(n.i)+'<span>'+n.t+'</span>'+(b?'<span class="badge">'+b+'</span>':'')+'</button>';
  }).join('');
  var dt=$('#dtoday'); if(dt) dt.textContent=fmtDate(todayStr());
}
function syncNav(){
  $$('#nav button').forEach(function(b){
    b.classList.toggle('on', b.dataset.v===ui.view);
    var v=b.dataset.v, want=badgeFor(v), old=b.querySelector('.badge');
    if(want&&old) old.textContent=want;
    else if(want&&!old){ var s=document.createElement('span'); s.className='badge'; s.textContent=want; b.appendChild(s); }
    else if(!want&&old) old.remove();
  });
}
function go(v){

/* ==================== 1 每日计划 ==================== */

  var done=list.filter(function(t){return t.done}).length;
  var pct=list.length?Math.round(done*100/list.length):0;
  var wo=S.workouts[today]||null, st=streak();

    '<button class="ico" onclick="shiftPlan(-1)">‹</button>'+

    '<button class="ico" onclick="shiftPlan(1)">›</button>'+
    '<span class="spacer"></span>'+

      '<div class="hm">完成 '+done+' / '+list.length+' 项</div>'+
      '<div class="hs">连续打卡 '+st+' 天'+(isToday?' · 今天'+(wo?'已打卡':'还没打卡'):'')+'</div>'+
    '</div>'+ring(pct)+'</div>';

  var todoCard='<div class="card">'+
    '<div class="card-head"><h2>'+svgIcon('plan')+'待办</h2><span class="hstat">'+(list.length?pct+'%':'')+'</span></div>'+
    progressBar(pct)+
    '<div class="addrow"><input id="todoInput" placeholder="添加要做的事" onkeydown="if(event.key===\'Enter\')addTodo()">'+
    '<button class="btn" onclick="addTodo()">加</button></div>'+
    (list.length? list.map(todoRow).join('') : emptyBox('还没安排','想清楚今天最重要的一件事，先写下来。'))+
    (isToday&&pend? '<button class="btn ghost sm wide" style="margin-top:12px" onclick="manualCarry()">把昨天没完成的 '+pend+' 项带过来</button>':'')+
  '</div>';

  var checkin='<div class="card">'+
    '<div class="card-head"><h2>'+svgIcon('body')+'今日打卡</h2><span class="hstat">连续 <b>'+st+'</b> 天</span></div>'+
    (wo? '<div class="done-line">已打卡 · '+esc(wo.types.join(' / '))+' · '+wo.mins+' 分钟</div><button class="btn ghost wide sm" onclick="go(\'body\')">修改今日记录</button>'
       : '<button class="btn wide" onclick="quickCheckin()">一键打卡 30 分钟</button><button class="btn ghost wide sm" style="margin-top:8px" onclick="go(\'body\')">详细记录</button>')+
  '</div>';

  var quick='<div class="card"><div class="card-head"><h2>'+svgIcon('note')+'随手记一句</h2><button class="btn ghost sm" onclick="go(\'notes\')">全部</button></div>'+
    '<div class="addrow" style="margin-bottom:10px"><input id="qn" placeholder="想法、灵感、待验证的念头…" onkeydown="if(event.key===\'Enter\')addQuickNote()">'+
    '<button class="btn" onclick="addQuickNote()">存</button></div>'+recentNotes(2)+'</div>';

  var bars=last7().map(function(x){

  }).join('');

  return strip+hero+todoCard+checkin+quick+week;
}
function todoRow(t){
  return '<div class="todo '+(t.done?'done':'')+'">'+
    '<button class="chk '+(t.done?'on':'')+'" onclick="toggleTodo(\''+t.id+'\')">'+(t.done?'✓':'')+'</button>'+
    '<span class="txt">'+esc(t.text)+'</span>'+
    (t.carry?'<span class="tag">顺延</span>':'')+
    (t.prio?'<span class="tag hi">重要</span>':'')+
    '<button class="icon-btn" onclick="todoMenu(\''+t.id+'\')">⋯</button>'+
  '</div>';
}
function last7(){
  var out=[];
  for(var i=6;i>=0;i--){
    var dt=addDays(todayStr(),-i),l=S.todos[dt]||[];
    var dn=l.filter(function(t){return t.done}).length;
    out.push({d:dt,n:l.length,dn:dn,pct:l.length?Math.round(dn*100/l.length):0});
  }
  return out;
}
function streak(){
  var n=0,d=todayStr();
  if(!S.workouts[d]) d=addDays(d,-1);
  while(S.workouts[d]){ n++; d=addDays(d,-1); }
  return n;
}
function shiftPlan(n){ ui.planDate=addDays(ui.planDate,n); render(); }
function addTodo(){
  var el=$('#todoInput'); if(!el) return;
  var v=el.value.trim(); if(!v){ el.focus(); return; }
  var d=ui.planDate;
  (S.todos[d]=S.todos[d]||[]).push({id:uid(),text:v,done:false,prio:false,ts:Date.now()});
  save(); render();
  var i=$('#todoInput'); if(i) i.focus();
}
function findTodo(id){
  for(var d in S.todos){ var l=S.todos[d]; for(var i=0;i<l.length;i++){ if(l[i].id===id) return l[i]; } }
  return null;
}
function toggleTodo(id){ var t=findTodo(id); if(!t) return; t.done=!t.done; t.doneAt=t.done?Date.now():null; save(); render(); }
function delTodo(id){
  for(var d in S.todos){ var l=S.todos[d];
    for(var i=0;i<l.length;i++){ if(l[i].id===id){ l.splice(i,1); save(); render(); return; } } }
}
function todoMenu(id){
  var t=findTodo(id); if(!t) return;
  var a=window.confirm('点「确定」= 标记/取消重要\n'+t.text+'\n\n（取消后想删除，请再长按…这里用两次操作：确定=重要，取消后弹删除）');

  if(window.confirm('删除这条待办？\n'+t.text)) delTodo(id);

function quickCheckin(){

  save(); render(); toast('已打卡 30 分钟');
}
function addQuickNote(){

}
function recentNotes(n){
  var l=(S.notes||[]).slice(0,n);

function whenStr(ts){

function addNote(){

/* ==================== 7 周复盘 ==================== */
function viewWeek(){
  var start=ui.wkStart, days=[], i;
  for(i=0;i<7;i++) days.push(addDays(start,i));
  var end=days[6], rev=S.reviews[start]||{good:'',bad:'',cause:'',next:''};

  var doneArr=days.map(function(d){
    var l=S.todos[d]||[], dn=l.filter(function(t){return t.done}).length;
    return {d:d,n:l.length,dn:dn,pct:l.length?Math.round(dn*100/l.length):0};
  });
  var withData=doneArr.filter(function(x){return x.n>0});
  var avg=withData.length?Math.round(withData.reduce(function(a,b){return a+b.pct},0)/withData.length):0;
  var weekNotes=(S.notes||[]).filter(function(n){ return n.ts>=parseISO(start).getTime()&&n.ts<parseISO(addDays(end,1)).getTime(); });
  var woDays=days.filter(function(d){return S.workouts[d]}).length;
  var fin=(S.finance||[]).filter(function(f){return f.date>=start&&f.date<=end});
  var inSum=fin.filter(function(f){return f.type==='in'}).reduce(function(a,b){return a+num(b.amount)},0);
  var outSum=fin.filter(function(f){return f.type==='out'}).reduce(function(a,b){return a+num(b.amount)},0);
  var newKnow=(S.knowledge||[]).filter(function(k){ return k.ts>=parseISO(start).getTime()&&k.ts<parseISO(addDays(end,1)).getTime(); }).length;

  var strip='<div class="datestrip">'+
    '<button class="ico" onclick="shiftWeek(-1)">‹</button>'+
    '<span class="ds">'+start.slice(5).replace('-','/')+' - '+end.slice(5).replace('-','/')+'</span>'+
    '<button class="ico" onclick="shiftWeek(1)">›</button>'+
    '<span class="spacer"></span>'+
    (ui.wkStart===mondayOf(todayStr())?'<span class="hstat">本周</span>'
      :'<button class="btn ghost sm" onclick="ui.wkStart=mondayOf(todayStr());render()">本周</button>')+'</div>';

  var stats='<div class="stats">'+
    '<div class="stat"><b>'+avg+'%</b><span>平均完成率</span></div>'+
    '<div class="stat"><b>'+weekNotes.length+'</b><span>本周速记</span></div>'+
    '<div class="stat"><b>'+woDays+'</b><span>锻炼天数</span></div>'+
    '<div class="stat"><b style="font-size:16px">'+money(inSum-outSum)+'</b><span>收支结余</span></div></div>';

  var bars='<div class="card"><div class="card-head"><h2>'+svgIcon('week')+'每日完成度</h2><span class="hstat">'+withData.length+' 天有计划</span></div>'+
    '<div class="bars">'+doneArr.map(function(x){
      var dd=parseISO(x.d);
      return '<div class="barcol" title="'+x.d+' '+x.dn+'/'+x.n+'"><div class="bararea"><i class="'+(x.pct?'':'zero')+'" style="height:'+(x.n?Math.max(x.pct,3):3)+'%"></i></div><span>'+WD[dd.getDay()].slice(1)+'</span></div>';
    }).join('')+'</div></div>';

  var notesCard='<div class="card"><div class="card-head"><h2>'+svgIcon('note')+'本周速记（'+weekNotes.length+'）</h2><span class="hstat">知识 +'+newKnow+'</span></div>'+
    (weekNotes.length? weekNotes.map(function(n){
      return '<div class="note-card"><div class="item-top" style="margin-bottom:3px"><span class="who">'+whenStr(n.ts)+'</span>'+
        (n.tags||[]).map(function(t){return '<span class="tag">#'+esc(t)+'</span>'}).join('')+'</div>'+
        '<div class="item-body" style="font-size:13px">'+esc(n.text)+'</div></div>';
    }).join('') : '<p class="hint">本周没有速记。</p>')+'</div>';

  var form='<div class="card"><div class="card-head"><h2>'+svgIcon('memo')+'四问复盘</h2><span class="hstat">自动保存</span></div>'+
    '<p class="hint" style="margin-bottom:5px">做得好的</p><textarea id="wGood" rows="2" onblur="saveReview()">'+esc(rev.good)+'</textarea>'+
    '<p class="hint" style="margin:11px 0 5px">做得不够的</p><textarea id="wBad" rows="2" onblur="saveReview()">'+esc(rev.bad)+'</textarea>'+
    '<p class="hint" style="margin:11px 0 5px">原因是什么</p><textarea id="wCause" rows="2" onblur="saveReview()">'+esc(rev.cause)+'</textarea>'+
    '<p class="hint" style="margin:11px 0 5px">下周改一件什么事</p><textarea id="wNext" rows="2" onblur="saveReview()">'+esc(rev.next)+'</textarea>'+
    '<button class="btn wide" style="margin-top:12px" onclick="saveReview(true)">保存本次复盘</button>'+
    '<p class="hstat" style="text-align:center;margin-top:8px">'+(rev.savedAt?'上次保存 '+whenStr(rev.savedAt):'还没保存过')+'</p></div>';

  var hk=Object.keys(S.reviews).sort().reverse();
  var hist='<div class="card"><div class="card-head"><h2>'+svgIcon('week')+'历史复盘</h2></div>'+
    (hk.length? hk.slice(0,10).map(function(k){
      var r=S.reviews[k], arr=[];
      for(var i=0;i<7;i++){ var d=addDays(k,i), l=S.todos[d]||[]; var dn=l.filter(function(t){return t.done}).length; if(l.length) arr.push(Math.round(dn*100/l.length)); }
      var a=arr.length?Math.round(arr.reduce(function(x,y){return x+y},0)/arr.length):0;
      return '<div class="listrow" onclick="ui.wkStart=\''+k+'\';render();window.scrollTo(0,0)"><span class="dt">'+k.slice(5).replace('-','/')+'</span>'+
        '<span class="nt" style="color:#4B7796">'+esc((r.next||r.good||'（未填写）').slice(0,26))+'</span>'+
        '<span class="amt" style="color:#4B7796;font-weight:400">'+a+'%</span></div>';
    }).join('') : emptyBox('还没有历史复盘','每周存一次，三个月后回看很有用。'))+'</div>';

  return strip+stats+bars+notesCard+form+hist;
}
function weekNo(){ return 0; }
function shiftWeek(n){ ui.wkStart=addDays(ui.wkStart,n*7); render(); }
function saveReview(manual){
  var key=ui.wkStart, r=S.reviews[key]||{};
  var g=$('#wGood'),b=$('#wBad'),c=$('#wCause'),n=$('#wNext');
  if(g&&b&&c&&n){
    r.good=g.value; r.bad=b.value; r.cause=c.value; r.next=n.value; r.savedAt=Date.now();
    S.reviews[key]=r; save();
    if(manual){ render(); toast('复盘已保存'); }
  }
}

/* ==================== 跨天带过来 ==================== */
function manualCarry(){
  var y=addDays(todayStr(),-1);
  var items=(S.todos[y]||[]).filter(function(x){return !x.done&&!x.carried});
  if(!items.length) return;
  openCarry(y,items);
}
function openCarry(from,items){
  carryState={from:from,items:items.map(function(x){ return {ref:x,keep:true}; })};
  $('#carryTitle').textContent='昨天还有 '+items.length+' 项没完成';
  $('#carryBody').innerHTML=carryState.items.map(function(it,i){
    return '<label class="carry-row"><input type="checkbox" checked onchange="carryToggle('+i+',this.checked)"><span>'+esc(it.ref.text)+'</span></label>';
  }).join('');
  $('#carryModal').classList.remove('hidden');
}
function carryToggle(i,v){ if(carryState) carryState.items[i].keep=v; }
function closeCarry(){ $('#carryModal').classList.add('hidden'); carryState=null; }
function carryApply(all){
  if(!carryState) return;
  var keep=all?carryState.items:carryState.items.filter(function(i){return i.keep});
  var t=todayStr();
  S.todos[t]=S.todos[t]||[];
  keep.forEach(function(it){
    S.todos[t].push({id:uid(),text:it.ref.text,done:false,prio:!!it.ref.prio,carry:true,ts:Date.now()});
  });
  carryState.items.forEach(function(it){ it.ref.carried=true; });
  save(); closeCarry(); render(); toast('已带过来 '+keep.length+' 项');
}
function initCarry(){
  var t=todayStr(), prev=S.meta.lastOpen;
  S.meta.lastOpen=t; save();
  if(!prev||prev>=t) return;
  var y=addDays(t,-1);
  var items=(S.todos[y]||[]).filter(function(x){return !x.done&&!x.carried});
  if(!items.length) return;
  openCarry(y,items);
}

/* ==================== 备份 ==================== */
function exportData(){
  var blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='工作台备份-'+todayStr()+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(a.href); },1000);
  toast('已导出备份');
}
function importData(input){
  var f=input.files[0]; if(!f) return;
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var o=JSON.parse(rd.result);
      if(!o||typeof o!=='object') throw new Error('bad');
      if(!confirm('导入会覆盖当前全部数据，继续？')){ input.value=''; return; }
      var b=blank();
      for(var k in b){ if(o[k]!==undefined) b[k]=o[k]; }
      S=b; save(); buildNav(); render(); toast('导入成功');
    }catch(e){ alert('文件格式不正确'); }
    input.value='';
  };
  rd.readAsText(f);
}
function clearAll(){
  if(!confirm('清空全部本地数据？建议先导出备份。')) return;
  if(!confirm('再确认一次：清空后无法恢复。')) return;
  S=blank(); save();
  ui.planDate=todayStr(); ui.wkStart=mondayOf(todayStr());
  buildNav(); render(); toast('已清空');
}

/* ==================== 启动 ==================== */
buildNav();
initCarry();
if(!STORAGE_OK){ var _sw=document.getElementById('stWarn'); if(_sw) _sw.classList.remove('hidden'); }
render();
window._day=todayStr();

setInterval(function(){
  if(todayStr()!==window._day){
    var old=window._day;
    if(ui.planDate===old) ui.planDate=todayStr();
    if(ui.wkStart===mondayOf(old)) ui.wkStart=mondayOf(todayStr());
    window._day=todayStr(); render();
  }
},20000);
document.addEventListener('visibilitychange',function(){
  if(!document.hidden&&todayStr()!==window._day){
    window._day=todayStr();
    if(ui.planDate!==todayStr()) ui.planDate=todayStr();
    render();
  }
});
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>
